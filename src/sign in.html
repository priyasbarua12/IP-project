<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpHub — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="sign in.css" />
    <link rel="stylesheet" href="layout.css" />
  </head>
  <body>
    <script src="layout.js"></script>
    <main class="page-shell">
      <section class="brand-panel" aria-label="HelpHub introduction">
        <a class="brand" href="index.html" aria-label="HelpHub home">
        </a>

        <div class="brand-copy">
          <h1>Smart help,<br />right nearby.</h1>
          <p>Trusted service providers, emergency assistance,<br />and local jobs — all in one place.</p>
          <div class="avatar-row" aria-label="HelpHub community members">
      
          </div>
        </div>

        <footer>© 2026 HelpHub</footer>
      </section>

      <section class="login-panel">
        <form class="login-card" id="loginForm">
          <header>
            <h2>Welcome back</h2>
            <p>Sign in to your account</p>
          </header>

          <div class="account-types" role="tablist" aria-label="Account type">
            <button class="account-type active" type="button" role="tab" aria-selected="true" data-type="Customer"><span>♟</span> Customer</button>
            <button class="account-type" type="button" role="tab" aria-selected="false" data-type="Service Provider"><span>⌁</span> Service Provider</button>
          </div>

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />

          <div class="field-heading">
            <label for="password">Password</label>
          </div>
          <input id="password" name="password" type="password" placeholder="••••••••" required />

          <button class="sign-in" type="submit">Sign In as Customer</button>

          <div class="divider"><span>or</span></div>
          <p class="signup">Don't have an account? <a href="register.html">Create one free</a></p>
          <p class="feedback" id="feedback" role="status"></p>
        </form>
      </section>
    </main>
    <script src="sign in.js"></script>
  </body>
</html>
