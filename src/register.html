<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registation form</title>
    </head>
    <body>
        <section class="heading">
        <center>
            <div>
               <img src="logo.jpeg" height="60" width="60">
                  <h2>HelpHub</h2>
            </div>
            <div>
                 <strong>Create you account</strong>
                  <p>join HelpHub for free in minutes.</p>
            </div>
        </center>
        </section>
        <section class="padding">
            <div>
            <form>
                <center>
                    <div>
                <input type="radio" id="Customer" name="role" value="Customer" required>
                <label for="Customer">👤Customer</label>
                   
                <input type="radio" id="Provider" name="role" value="Provider">
                <label for="Provider">⚙️Service Provider</label><br><br>
                    </div>
                </center
              <div>
                <label><b>Full Name</b></label><br><br>
                <input type="text" placeholder="Enter your Full Name" name="Full name" required>
                <br><br>
                <label><b>Email Address</b></label><br><br>
                <input type="text" placeholder="you@example.com" name="Email account" required>
                <br><br>
                <label><b>Phone</b></label><br><br>
                <input type="text" placeholder="+880**********" name="Phone" required>
                <br><br>
                <label><b>Password</b></label><br><br>
                <input type="text" placeholder="8+ characters" name="password" required>
                <br><br>
              </div>
              <div>
                <button type="submit">Continue➡️</button>
                </div>
                <br>
                <p>By creating an account you agree to our <b>Terms of Service</b> and<b>Privacy Policy</b></p>
                <br>
            </div>
            </form>
            </div>
        </section>
        <section class="ending">
            <div>
                <center>
                    <p>Already have an account?</p>
                   <a href="Sign in.html">Sign in</a>
                </center>
            </div>
        </section>
    </body>
</html>
